[workspace]
members = [
    "crates/diacritter-core",
    "crates/diacritter",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ermenegildo Fiorito", "Moritz Moeller"]
repository = "https://github.com/virtualritz/diacritter"
readme = "README.md"

[workspace.dependencies]
diacritter-core = { path = "crates/diacritter-core", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
